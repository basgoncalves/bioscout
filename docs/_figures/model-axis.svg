  .card{fill:#ffffff;stroke:#d9d5cd}
  .panel{fill:#f4f2ee;stroke:#dedad2}
  .ink{fill:#22201d}
  .muted{fill:#6d6960}
  .bad{fill:#b1503a}
  .good{fill:#2c7a6b}
  .goodS{stroke:#2c7a6b}
  .blue{fill:#3a6ba5}
  .blueS{stroke:#3a6ba5}
  .line{stroke:#a9a49a;fill:none}
  .ship{fill:#e2f0ec;stroke:#8ec6b7}
  .open{fill:#f7ece8;stroke:#dcb9ac}
  .tint{fill:#eef3f9;stroke:#c3d4e6}
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,"SFMono-Regular","Consolas","Liberation Mono",monospace}
  .h{font-size:19px;font-weight:700}
  .sh{font-size:13px;font-weight:700;letter-spacing:.07em}

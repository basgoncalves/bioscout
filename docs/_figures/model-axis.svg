<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img" aria-labelledby="t d">
<title id="t">The model axis: personalisation, organisation, verification</title>
<desc id="d">The other axis of bioscout: producing, organising and trusting the osim files themselves. A generic template plus subject measurements goes through one of four morph back-ends selected by method, including a rigid passthrough that produces the baseline arm through the identical code path. The result is verified in three steps — model-diff on the edit, geometry resolution per mesh tier, and muscle_inspect against literature bands — before the model enters the trial pipeline. Three of the four steps are still hand-run scripts with no bioscout verb.</desc>
<style>

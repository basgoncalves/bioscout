<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" role="img" aria-labelledby="t d">
<title id="t">Where a fact lives: retiring settings.py</title>
<desc id="d">settings.py conflates five kinds of thing with different owners, lifetimes and change rates. Library code belongs in bioscout and is upgraded by pip; lab facts belong in a declarative project.yaml; session facts belong in session.yaml; run selection belongs at the call site and is never persisted; paths are convention, and only a deviation needs stating.</desc>

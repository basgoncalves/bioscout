<rect class="bg" width="1040" height="620"/>
<text class="ink h" x="28" y="38">§2.9 — one file, five owners: where each fact actually belongs</text>
<text class="muted b" x="28" y="60">The problem is not that settings.py is long. It is that these five have different owners, lifetimes and change rates.</text>

<!-- LEFT: the one file -->
<text class="bad sh" x="28" y="100">COPIED PER PROJECT</text>
<rect class="panel" x="24" y="112" width="316" height="452" rx="10"/>
<text class="ink mono s" x="42" y="138" font-weight="700">settings.py</text>
<text class="muted xs" x="42" y="154">~1500 lines · copied and mutated per project</text>

<rect class="sl1" x="42" y="168" width="280" height="66" rx="6"/>
<text class="k1 s" x="56" y="188" font-weight="700">Subject, Inputs, build_model_config,</text>
<text class="k1 s" x="56" y="204" font-weight="700">the runner functions</text>
<text class="muted xs" x="56" y="222">changes every release · owner: bioscout</text>

<rect class="sl2" x="42" y="244" width="280" height="66" rx="6"/>
<text class="k2 s" x="56" y="264" font-weight="700">marker conventions, EMG channels,</text>
<text class="k2 s" x="56" y="280" font-weight="700">plate mapping, filter defaults</text>
<text class="muted xs" x="56" y="298">changes ~never · owner: the lab</text>

<rect class="sl3" x="42" y="320" width="280" height="66" rx="6"/>
<text class="k3 s" x="56" y="340" font-weight="700">trials, time windows, body mass,</text>
<text class="k3 s" x="56" y="356" font-weight="700">models, emg_map, calibrations</text>
<text class="muted xs" x="56" y="374">changes per session · owner: the session</text>

<rect class="sl4" x="42" y="396" width="280" height="66" rx="6"/>
<text class="k4 s" x="56" y="416" font-weight="700">SUBJECTS, TRIALS, DO_SO, --replace</text>
<text class="muted xs" x="56" y="434">true for one afternoon · owner: whoever</text>
<text class="muted xs" x="56" y="450">is at the keyboard right now</text>

<rect class="sl5" x="42" y="472" width="280" height="58" rx="6"/>
<text class="k5 s" x="56" y="492" font-weight="700">MODELS_DIR, SIMULATIONS_DIR, …</text>
<text class="muted xs" x="56" y="510">already implied by the folder layout</text>

<text class="bad xs" x="42" y="550">Copying code into projects IS the drift problem.</text>

<!-- arrows -->
<path class="line s1" d="M330 200 C 400 200, 400 176, 470 176" marker-end="url(#a1)"/>
<path class="line s2" d="M330 276 C 400 276, 400 264, 470 264" marker-end="url(#a2)"/>
<path class="line s3" d="M330 352 C 400 352, 400 352, 470 352" marker-end="url(#a3)"/>
<path class="line s4" d="M330 428 C 400 428, 400 440, 470 440" marker-end="url(#a4)"/>
<path class="line s5" d="M330 500 C 400 500, 400 528, 470 528" marker-end="url(#a5)"/>

<!-- RIGHT: destinations -->
<text class="good sh" x="474" y="100">WHERE IT BELONGS</text>

<rect class="card" x="474" y="144" width="542" height="66" rx="7"/>
<text class="k1 s" x="490" y="166" font-weight="700">library code</text>
<text class="ink mono s" x="640" y="166">bioscout</text>
<text class="muted xs" x="490" y="186">Versioned ONCE, upgraded by pip install -U. The Powerlifting copy is 112 lines</text>
<text class="muted xs" x="490" y="200">ahead of the template while both claim schema 2.0.0b1 — you cannot diff code shape.</text>

<rect class="card" x="474" y="232" width="542" height="66" rx="7"/>
<text class="k2 s" x="490" y="254" font-weight="700">lab facts</text>
<text class="ink mono s" x="640" y="254">project.yaml</text>
<text class="muted xs" x="490" y="274">~20 declarative lines at the project root. Data, not code. Sections mirror the</text>
<text class="muted xs" x="490" y="288">stages (capture / curation / model / solve / results) in schema 2.</text>

<rect class="card" x="474" y="320" width="542" height="66" rx="7"/>
<text class="k3 s" x="490" y="342" font-weight="700">session facts</text>
<text class="ink mono s" x="640" y="342">session.yaml</text>
<text class="muted xs" x="490" y="362">Already done — the models / markerset / emg_filter moves of 2026-08-18/19</text>
<text class="muted xs" x="490" y="376">completed it.</text>

<rect class="card" x="474" y="408" width="542" height="66" rx="7"/>
<text class="k4 s" x="490" y="430" font-weight="700">run selection</text>
<text class="ink mono s" x="640" y="430">the call site — CLI / notebook / GUI</text>
<text class="muted xs" x="490" y="450">NEVER persisted. A selection written into a settings file is why "run the pipeline"</text>
<text class="muted xs" x="490" y="464">silently re-ran one subject from March.</text>

<rect class="card" x="474" y="496" width="542" height="66" rx="7"/>
<text class="k5 s" x="490" y="518" font-weight="700">paths</text>
<text class="ink mono s" x="640" y="518">convention</text>
<text class="muted xs" x="490" y="538">The folder layout IS the configuration: models/{generic,personalised,utils},</text>
<text class="muted xs" x="490" y="552">simulations/&lt;subject&gt;/&lt;session&gt;, results/. Only a deviation needs stating.</text>

<text class="muted xs" x="474" y="582">settings.py survives only as an optional hook for code-level overrides.</text>
<text class="muted xs" x="474" y="598">`bioscout project init` extracts a project.yaml from an existing one.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" role="img" aria-labelledby="t d">
<title id="t">The pipeline, and the gates that keep it honest</title>
<desc id="d">c3d through export, classify, scale, IK/ID/MA, static optimisation and JRA, CEINMS, to results. A preflight gate runs before any solving and fails in seconds; each stage declares its input contract and refuses rather than degrading; the run ends with a per-trial per-stage ok/MISS table and a run_report.json, and exits non-zero when a requested stage produced nothing. Annotations mark the silent failures each gate now catches.</desc>
<style>
  .bg{fill:#fbfaf8}
  .card{fill:#ffffff;stroke:#d9d5cd}
  .panel{fill:#f4f2ee;stroke:#dedad2}
  .ink{fill:#22201d}
  .muted{fill:#6d6960}
  .bad{fill:#b1503a}
  .badS{stroke:#b1503a}
  .good{fill:#2c7a6b}
  .goodS{stroke:#2c7a6b}
  .blue{fill:#3a6ba5}
  .line{stroke:#a9a49a;fill:none}
  .gate{fill:#e2f0ec;stroke:#8ec6b7}
  .trap{fill:#f7ece8;stroke:#dcb9ac}
  .io{fill:#f4f2ee;stroke:#ddd8ce}
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,"SFMono-Regular","Consolas","Liberation Mono",monospace}
  .h{font-size:19px;font-weight:700}
  .sh{font-size:13px;font-weight:700;letter-spacing:.07em}
  .b{font-size:13.5px}
  .s{font-size:12px}
  .xs{font-size:10.5px}
  @media (prefers-color-scheme: dark){
    .bg{fill:#15171a}
    .card{fill:#1e2226;stroke:#3b4148}
    .panel{fill:#191d21;stroke:#333940}
    .ink{fill:#e7e4df}
    .muted{fill:#9aa1a8}
    .bad{fill:#e59175}
    .badS{stroke:#e59175}
    .good{fill:#63c2ad}
    .goodS{stroke:#63c2ad}
    .blue{fill:#84b2e2}
    .line{stroke:#5a626a}
    .gate{fill:#17302c;stroke:#3d7a6b}
    .trap{fill:#2e2320;stroke:#5c4038}
    .io{fill:#1b1f23;stroke:#343a41}
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a49a"/></marker>
  <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="good"/></marker>
</defs>

<rect class="bg" width="1120" height="700"/>
<text class="ink h" x="28" y="38">§1 · §2.2 · §2.8 — the pipeline, and the three gates that keep it honest</text>
<text class="muted b" x="28" y="60">Every stage declares its input contract and refuses. A run that produced nothing must not be able to end by saying “done”.</text>

<!-- GATE 1: preflight -->
<rect class="gate" x="24" y="86" width="196" height="150" rx="9"/>
<text class="good sh" x="40" y="110">GATE 1 · PREFLIGHT</text>
<text class="muted xs" x="40" y="128">Fail in seconds, not hours in.</text>
<text class="ink xs" x="40" y="150">· every scoped trial has a c3d</text>
<text class="ink xs" x="40" y="166">· so_model / ceinms_model resolve</text>
<text class="ink xs" x="40" y="182">· time_range present</text>
<text class="ink xs" x="40" y="198">· emg_map keys exist in the analogs</text>
<text class="ink xs" x="40" y="214">· path lengths under MAX_PATH</text>
<text class="ink xs" x="40" y="230">· import opensim works</text>

<path class="line goodS" d="M220 160 L 262 160" marker-end="url(#arG)"/>

<!-- the chain -->
<rect class="card" x="266" y="120" width="126" height="78" rx="8"/>
<text class="ink s" x="329" y="146" text-anchor="middle" font-weight="700">export</text>
<text class="muted xs" x="329" y="164" text-anchor="middle">c3d → trc / mot</text>
<text class="muted xs" x="329" y="178" text-anchor="middle">+ EMG</text>

<rect class="card" x="410" y="120" width="126" height="78" rx="8"/>
<text class="ink s" x="473" y="146" text-anchor="middle" font-weight="700">classify</text>
<text class="muted xs" x="473" y="164" text-anchor="middle">what is each</text>
<text class="muted xs" x="473" y="178" text-anchor="middle">trial</text>

<rect class="card" x="554" y="120" width="126" height="78" rx="8"/>
<text class="ink s" x="617" y="146" text-anchor="middle" font-weight="700">scale</text>
<text class="muted xs" x="617" y="164" text-anchor="middle">generic + static</text>
<text class="muted xs" x="617" y="178" text-anchor="middle">→ model</text>

<rect class="card" x="698" y="120" width="126" height="78" rx="8"/>
<text class="ink s" x="761" y="146" text-anchor="middle" font-weight="700">kinetics</text>
<text class="muted xs" x="761" y="164" text-anchor="middle">IK → ID → MA</text>
<text class="bad xs" x="761" y="178" text-anchor="middle">(was “exbiomec”)</text>

<rect class="card" x="842" y="120" width="126" height="78" rx="8"/>
<text class="ink s" x="905" y="146" text-anchor="middle" font-weight="700">so → jra</text>
<text class="muted xs" x="905" y="164" text-anchor="middle">static opt,</text>
<text class="muted xs" x="905" y="178" text-anchor="middle">joint reactions</text>

<rect class="card" x="986" y="120" width="110" height="78" rx="8"/>
<text class="ink s" x="1041" y="146" text-anchor="middle" font-weight="700">ceinms</text>
<text class="muted xs" x="1041" y="164" text-anchor="middle">emg max →</text>
<text class="muted xs" x="1041" y="178" text-anchor="middle">calibrate → exec</text>

<path class="line" d="M392 159 L 406 159" marker-end="url(#ar)"/>
<path class="line" d="M536 159 L 550 159" marker-end="url(#ar)"/>
<path class="line" d="M680 159 L 694 159" marker-end="url(#ar)"/>
<path class="line" d="M824 159 L 838 159" marker-end="url(#ar)"/>
<path class="line" d="M968 159 L 982 159" marker-end="url(#ar)"/>

<!-- GATE 2: contract band -->
<rect class="gate" x="266" y="212" width="830" height="76" rx="8"/>
<text class="good sh" x="284" y="234">GATE 2 · EVERY STAGE DECLARES ITS CONTRACT AND REFUSES — IT NEVER DEGRADES</text>
<text class="muted xs" x="284" y="254">JRA handed a raw CEINMS MuscleForces.sto — no residuals, no reserves — now refuses, instead of producing</text>
<text class="muted xs" x="284" y="270">contact forces ~100× too large that are ALSO identical across arms. A switch is not implemented until an output differs when it is flipped.</text>

<!-- traps caught -->
<text class="bad sh" x="28" y="316">THE SILENT FAILURES THESE GATES CATCH  —  “a run can end [settings] done with export having failed on every trial”</text>

<rect class="trap" x="24" y="330" width="256" height="96" rx="8"/>
<text class="bad s" x="40" y="352" font-weight="700">EMG mapped to the wrong column</text>
<text class="muted xs" x="40" y="372">The c3ds export every electrode twice —</text>
<text class="muted xs" x="40" y="386">bare Voltage_N and tagged Voltage_N-VM.</text>
<text class="muted xs" x="40" y="400">Normalise, calibrate and execute ran on</text>
<text class="muted xs" x="40" y="414">the wrong signal, without one warning.</text>

<rect class="trap" x="296" y="330" width="256" height="96" rx="8"/>
<text class="bad s" x="312" y="352" font-weight="700">Duplicate YAML keys</text>
<text class="muted xs" x="312" y="372">Voltage_1: written twice in a generated</text>
<text class="muted xs" x="312" y="386">session.yaml — YAML silently keeps the</text>
<text class="muted xs" x="312" y="400">last one. The writer now refuses to emit</text>
<text class="muted xs" x="312" y="414">a duplicate; every read scans for them.</text>

<rect class="trap" x="568" y="330" width="256" height="96" rx="8"/>
<text class="bad s" x="584" y="352" font-weight="700">A model with no bones</text>
<text class="muted xs" x="584" y="372">Move a model and OpenSim resolves its</text>
<text class="muted xs" x="584" y="386">meshes relative to the new folder: it opens</text>
<text class="muted xs" x="584" y="400">with muscles, markers and no skeleton,</text>
<text class="muted xs" x="584" y="414">no error, no log line. → see §3.2</text>

<rect class="trap" x="840" y="330" width="256" height="96" rx="8"/>
<text class="bad s" x="856" y="352" font-weight="700">Windows MAX_PATH</text>
<text class="muted xs" x="856" y="372">Session trees plus CEINMS execution folder</text>
<text class="muted xs" x="856" y="386">names pass 260 chars at ~220-char roots.</text>
<text class="muted xs" x="856" y="400">The failure surfaces as “file not found”</text>
<text class="muted xs" x="856" y="414">deep inside OpenSim.</text>

<!-- GATE 3 -->
<path class="line goodS" d="M560 432 L 560 470" marker-end="url(#arG)"/>

<rect class="gate" x="24" y="476" width="1072" height="132" rx="9"/>
<text class="good sh" x="44" y="500">GATE 3 · VERIFY — THE RUN ENDS WITH EVIDENCE, NOT WITH “DONE”</text>

<rect class="card" x="44" y="512" width="500" height="82" rx="7"/>
<g class="mono xs">
  <text class="muted" x="60" y="532">trial</text>
  <text class="muted" x="192" y="532">export</text><text class="muted" x="248" y="532">ik</text><text class="muted" x="284" y="532">id</text><text class="muted" x="320" y="532">ma</text><text class="muted" x="356" y="532">so</text><text class="muted" x="392" y="532">jra</text><text class="muted" x="436" y="532">ceinms</text>

  <text class="ink" x="60" y="550">Squat_BW_01</text>
  <text class="good" x="192" y="550">ok</text><text class="good" x="248" y="550">ok</text><text class="good" x="284" y="550">ok</text><text class="good" x="320" y="550">ok</text><text class="good" x="356" y="550">ok</text><text class="good" x="392" y="550">ok</text><text class="good" x="436" y="550">ok</text>

  <text class="ink" x="60" y="568">running_02</text>
  <text class="good" x="192" y="568">ok</text><text class="good" x="248" y="568">ok</text><text class="good" x="284" y="568">ok</text><text class="good" x="320" y="568">ok</text><text class="good" x="356" y="568">ok</text><text class="good" x="392" y="568">ok</text><text class="bad" x="436" y="568">MISS</text>

  <text class="ink" x="60" y="586">walking1</text>
  <text class="bad" x="192" y="586">MISS</text><text class="bad" x="248" y="586">MISS</text><text class="bad" x="284" y="586">MISS</text><text class="bad" x="320" y="586">MISS</text><text class="bad" x="356" y="586">MISS</text><text class="bad" x="392" y="586">MISS</text><text class="bad" x="436" y="586">MISS</text>
</g>

<text class="ink s" x="576" y="534" font-weight="700">…written as run_report.json next to the log,</text>
<text class="ink s" x="576" y="552" font-weight="700">and the run exits non-zero.</text>
<text class="muted xs" x="576" y="574">Machine-readable status is what makes a 29-subject batch auditable —</text>
<text class="muted xs" x="576" y="588">and it names the trials TRC export skipped instead of scrolling past them.</text>

<text class="muted xs" x="28" y="636">Shipped 2026-08-19 in bioscout/utils/run_check.py (stdlib-only, 15 tests). Gate 1 exists today only as project-side scripts — §2.2 is the ask to move it into the library and run it automatically.</text>
<text class="muted xs" x="28" y="654">Naming: stage ids are lowercase single words and are the only identifier that appears in a flag, a dict key or a log line (§2.10).</text>
</svg>
